manufacturer: CommScope
model: G54
brands:
  - "Arris"
transport: http
default_host: "192.168.0.1"

auth:
  strategy: form
  action: "/cgi-bin/luci"
  username_field: luci_username
  password_field: luci_password
  cookie_name: "sysauth"

  success:
    redirect: "/cgi-bin/luci/admin/gateway/wan_status"

hardware:
  docsis_version: "3.1"
  release_date: "2023"

status: awaiting_verification

sources:
  auth_config: "[#72 Arris G54](https://github.com/solentlabs/cable_modem_monitor/issues/72)"

  brands: 'Firmware `customer` field in test_data/modem.har ("ARRIS Group, Inc.") — box branding'
  detection_hints: "[#72 Arris G54](https://github.com/solentlabs/cable_modem_monitor/issues/72)"
  hardware: "[#72 Arris G54](https://github.com/solentlabs/cable_modem_monitor/issues/72)"
  release_date: "[CommScope press release, 2023-10-12](https://www.nasdaq.com/press-release/commscope-launches-arris-surfboard-g54-docsis-3.1-quad-band-wi-fi-7-cable-modem-into) (read 2026-10-20): the ARRIS SURFboard G54 'will be available to consumers starting on October 15' (2023)."
  isps: "[SURFboard G54 product page](https://www.surfboard.com/products/cable-modems/g54/) (read 2026-10-20): 'Compatible with Cox, Spectrum, Xfinity and other major U.S. cable internet providers'; footer 'Cox, Comcast Xfinity, and Charter Spectrum'. Cox's [certified list](https://www.cox.com/residential/support/certified-cable-modems.html) and Spectrum's [authorized list](https://www.spectrum.net/support/internet/compliant-modems-spectrum-network) name the G54 (both read 2026-10-20)."

attribution:
  contributors:
    - github: https://github.com/MrAct1on
      contribution: "Initial G54 support and HAR capture"

isps:
  - Cox
  - Spectrum
  - Xfinity

notes: |
  Gateway device (modem + router combo) with DOCSIS 3.1.
  Uses LuCI (OpenWrt-based) web interface with JSON endpoints.
  Form-based authentication with sysauth cookie.
  Modem was in Bridge mode during fixture capture (WiFi disabled).
  puma_hw_ver fields are legacy naming - actual chipset is BCM3390.
  Firmware self-reports product "G54_COMMSCOPE" on platform "G5X" and
  customer "ARRIS Group, Inc." (see test_data/modem.har).
  Default IPs: 192.168.100.1 (modem mode) or 192.168.0.1 (router mode).

references:
  issues:
    - "[#72 — [Modem Request] Arris G54](https://github.com/solentlabs/cable_modem_monitor/issues/72)"
