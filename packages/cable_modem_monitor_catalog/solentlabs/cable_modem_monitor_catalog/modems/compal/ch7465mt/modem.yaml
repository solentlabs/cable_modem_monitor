manufacturer: Compal
model: CH7465MT
transport: cbn
default_host: "192.168.0.1"

auth:
  strategy: form_cbn

actions:
  restart:
    type: cbn
    fun: 8
  logout:
    type: cbn
    fun: 16

hardware:
  docsis_version: "3.0"
  release_date: "2015"
  chipset: "Intel Puma DHCE2652"

detection:
  http_headers:
    - "NET-DK"

status: confirmed

sources:
  isps:
    "[Magenta Austria — Internet Fiber Box support page](https://www.magenta.at/hilfe-service/services/hardwaresupport/device/internet-fiber/box)
    and [user manual](https://www.magenta.at/content/dam/magenta_at/pdfs/consumer/faq/Benutzerhandbuch_Internet_Fiber_Box.pdf)
    — Magenta distributes the CH7465MT as the Internet Fiber Box;
    MT operator suffix = Magenta Telekom (as LG = Liberty Global)"
  auth_config: "[PR #129 — CH7465MT HAR captures](https://github.com/solentlabs/cable_modem_monitor/pull/129)"
  hardware: "[Compal CH7465MT datasheet](https://www.compal-broadband.com)"
  chipset:
    "[DeviWiki — Compal CH7465LG-LC](https://deviwiki.com/wiki/Compal_Broadband_Networks_CH7465LG-LC)
    — Intel Puma DHCE2652 (1.2 GHz dual-core), 128 MiB flash, 512 MiB RAM;
    sibling LG variant in the CH7465 family, same hardware platform"
  release_date: "Left from the original entry; no date specific to the Magenta CH7465MT was found. The CH7465 family was first shown by Liberty Global at IBC, reported by [Telecompaper on 2015-09-16](https://www.telecompaper.com/nieuws/liberty-global-ontwikkelt-nieuwe-modem-voor-ziggo-telenet--1102755) (read 2026-10-20) with no launch schedule. The [TechInfoDepot CH7465LG-LC page](https://techinfodepot.shoutwiki.com/wiki/Compal_Broadband_Networks_CH7465LG-LC) (read 2026-10-20) has an FCC approval date of 2018-02-27 and a note dated 2016-05-13."

attribution:
  contributors:
    - github: https://github.com/mtheli
      contribution: "HAR captures (3x sanitized), v3.13 implementation (PR #129)"
    - github: https://github.com/kwschulz
      contribution: "Maintainer — v3.14 CBN transport, parser, catalog entry"

isps:
  - Magenta AT

notes: |
  CBN (Compal Broadband Networks) firmware modem.
  XML POST API: single getter/setter endpoints, fun=N parameter dispatch.
  Rotating sessionToken cookie on every response.
  AES-256-CBC encrypted login (CBN_Encrypt from encrypt_cryptoJS.js).
  Max 1 concurrent session — explicit logout required.
  Default credentials: unknown / user-configured password.

references:
  issues:
    - "[#77 — [Modem Request] Compal CH7465 used by Vodafone Germany](https://github.com/solentlabs/cable_modem_monitor/issues/77)"
    - "[#80 — [Modem Request] Compal CH7466CE as used by Vodafone Germany](https://github.com/solentlabs/cable_modem_monitor/issues/80)"
  prs:
    - "[#129 — CH7465MT implementation](https://github.com/solentlabs/cable_modem_monitor/pull/129)"
