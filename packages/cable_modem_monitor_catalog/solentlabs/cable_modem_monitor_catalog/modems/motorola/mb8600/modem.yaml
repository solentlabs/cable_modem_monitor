manufacturer: Motorola
model: MB8600
brands: []
transport: hnap
default_host: 192.168.100.1

auth:
  strategy: hnap
  hmac_algorithm: md5

actions:
  restart:
    type: hnap
    action_name: SetStatusSecuritySettings
    # "XXX" is NOT a placeholder. The firmware really calls
    # GetMotoStatusSecXXX and sends MotoStatusSecXXX: "XXX". Confirmed on
    # the MB8611 (same firmware family) via cvonk's restart-flow HAR
    # (issue #60, June 2026); see motorola/mb8611/modem.yaml.
    pre_fetch_action: GetMotoStatusSecXXX
    params:
      MotoStatusSecXXX: XXX
      MotoStatusSecurityAction: "1"
    response_key: SetStatusSecuritySettingsResponse
    result_key: SetStatusSecuritySettingsResult
    success_value: OK

hardware:
  docsis_version: "3.1"
  chipset: Broadcom BCM3390
  release_date: "2017"

status: confirmed

sources:
  auth_config: "[#40 MB8600 newer firmware](https://github.com/solentlabs/cable_modem_monitor/issues/40)"
  chipset: "[AfrozAhmad MB8611 review](https://afrozahmad.com/blog/motorola-mb8611-cable-modem-review/) — same BCM3390 platform as MB8611"
  hardware: "[Motorola MB8600 page](https://www.motorola.com/us/mb8600)"
  verification: "User diagnostics capture on v3.14.0-alpha.11 (2026-04-07, Issue #40)"
  release_date: "[Stop the Cap, 2017-05-16](https://stopthecap.com/2017/05/16/zooms-motorola-mb8600-docsis-3-1-modem-arrives-month-159-99) (read 2026-10-20): Zoom 'will introduce' the MB8600 'later this month' at $159.99. SpeedGuide added its listing on 2017-09-07."
  isps: "[Motorola MB8600 product page, Wayback capture 2021-06-20](https://web.archive.org/web/20210620212057/https://www.motorola.com/us/mb8600/): 'certified for Comcast XFINITY, Comcast Business, and Cox Communications'. [Cox certified cable modems](https://www.cox.com/residential/support/certified-cable-modems.html) names the MB8600 (read 2026-10-20). Spectrum: the reporter of [#40](https://github.com/solentlabs/cable_modem_monitor/issues/40) lists Spectrum as their ISP; Spectrum's [authorized modem list](https://www.spectrum.net/support/internet/compliant-modems-spectrum-network) does not name the MB8600 (read 2026-10-20)."

attribution:
  contributors:
    - github: https://github.com/BowlesCR
      contribution: "MB8600 HAR capture and HNAP auth reverse-engineering (Issue #40)"
    - github: https://github.com/RoGreat
      contribution: "Independent verification and diagnostics capture (Issue #40)"

isps:
  - Comcast
  - Xfinity
  - Cox
  - Spectrum

notes: |
  Same HNAP protocol as MB8611 — uses GetMoto* action names.
  Predecessor to the MB8611 (2017 vs 2020 release).
  Parser is identical to MB8611.
  Default credentials: admin / motorola
  Compatible: MB8611 (same parser and HNAP protocol).

references:
  issues:
    - "[#40 — [Modem Request] MB8600 (Newer firmware?)](https://github.com/solentlabs/cable_modem_monitor/issues/40)"
