manufacturer: Technicolor
model: TC4400
model_aliases:
  - TC4400AM
transport: http
default_host: "192.168.100.1"
timeout: 20

auth:
  strategy: basic

hardware:
  docsis_version: "3.1"
  chipset: "Broadcom BCM3390"
  release_date: "2017"

detection:
  http_headers:
    - "micro_httpd"

status: awaiting_verification

sources:
  model_aliases: "Unit label TC4400-AM on retail listings (e.g. https://www.ebay.com/itm/406711931022)"
  auth_config: "[#1 TC-4400 Login](https://github.com/solentlabs/cable_modem_monitor/issues/1)"
  chipset: "[TechInfoDepot technicolor TC4400](https://techinfodepot.shoutwiki.com/wiki/Technicolor_TC4400) (read 2026-10-20): Broadcom BCM3390. The earlier FCC link (ID VU4-TC4400) is a grantee code that belongs to another company and has no TC4400 record."

  detection_hints: "[#1 TC-4400 Login](https://github.com/solentlabs/cable_modem_monitor/issues/1)"
  release_date: "Left from the original entry; 2017 is not sourced. The [TC4400 datasheet](https://lightspeed.ca/wp-content/uploads/2020/07/TC4400DataSheet.pdf) carries 'Copyright 2016 Technicolor', and the [CableLabs certified products list](https://web.archive.org/web/20260216183300/https://www.cablelabs.com/wp-content/uploads/2013/10/Certified_Products.pdf) (Wayback capture 2026-02-16) has the TC4400-XM6 with CQ Date 2016, so the modem existed in 2016."
  isps: "Teksavvy: reporter of [#94](https://github.com/solentlabs/cable_modem_monitor/issues/94). Comcast, Cox, Spectrum, Rogers, Shaw, Videotron, Vodafone Germany and Unitymedia: no source opened names the TC4400 for them, and neither Cox's [certified list](https://www.cox.com/residential/support/certified-cable-modems.html) nor Spectrum's [authorized list](https://www.spectrum.net/support/internet/compliant-modems-spectrum-network) names it (both read 2026-10-20). Kept from the original entry."

attribution:
  contributors:
    - github: https://github.com/Mar1usW3
      contribution:
        "[Issue #1](https://github.com/solentlabs/cable_modem_monitor/issues/1)
        verification"
    - github: https://github.com/MrHankey777x
      contribution: "TC4400AM variant confirmation (Issue #94)"

isps:
  - Comcast
  - Cox
  - Spectrum
  - Rogers
  - Shaw
  - Videotron
  - Vodafone Germany
  - Unitymedia
  - Teksavvy

notes: |
  DOCSIS 3.1 standalone cable modem. Supports SC-QAM and OFDM channel types.
  System uptime available in cmswinfo.html.
  Data across multiple pages: cmconnectionstatus.html (channels), cmswinfo.html (system info).
  Restart reports zero power during reboot window (300 seconds).
  LAN byte counters come from statsifc.html ("Statistics -- LAN"), summed across
  its interface rows. They keep the page's own Received and Transmitted labels: the
  capture does not say which way each points relative to the cable side, and no
  transfer test or documentation has confirmed it.

references:
  issues:
    - "[#1 — TC-4400 Login not possible](https://github.com/solentlabs/cable_modem_monitor/issues/1)"
    - "[#94 — [Modem Request] Technicolor TC4400AM](https://github.com/solentlabs/cable_modem_monitor/issues/94)"
