downstream:
  format: json
  resource: /api/v1/modem/exUSTbl,exDSTbl,USTbl,DSTbl,ErrTbl
  arrays:
    # SC-QAM downstream channels
    - array_path: data.DSTbl
      channel_type:
        fixed: qam
      fields:
        - key: __id
          field: channel_index
          type: integer
        - key: ChannelID
          field: channel_id
          type: integer
        - key: Frequency
          field: frequency
          type: frequency
        - key: PowerLevel
          field: power
          type: float
        - key: SNRLevel
          field: snr
          type: float
        - key: Modulation
          field: modulation
          type: modulation
        - key: Octets
          field: bytes
          type: integer
        - key: LockStatus
          field: lock_status
          type: lock_status
      filter:
        lock_status: locked
    # OFDM downstream channels
    - array_path: data.exDSTbl
      channel_type:
        fixed: ofdm
      fields:
        - key: ChannelIndex
          field: channel_index
          type: integer
        - key: ChannelID
          field: channel_id
          type: integer
        - key: CentralFrequency
          field: frequency
          type: frequency
        - key: PowerLevel
          field: power
          type: float
        - key: SNRLevel
          field: snr
          type: float
        - key: BandWidth
          field: channel_width
          type: integer
        - key: LockStatus
          field: lock_status
          type: lock_status
      filter:
        lock_status: locked
    # Error counters: ErrTbl rows are keyed by the downstream channel index
    - array_path: data.ErrTbl
      merge_by: [channel_index]
      fields:
        - key: __id
          field: channel_index
          type: integer
        - key: Correcteds
          field: corrected
          type: integer
        - key: Uncorrectables
          field: uncorrected
          type: integer

upstream:
  format: json
  resource: /api/v1/modem/exUSTbl,exDSTbl,USTbl,DSTbl,ErrTbl
  arrays:
    # SC-QAM upstream channels
    - array_path: data.USTbl
      channel_type:
        fixed: atdma
      fields:
        - key: ChannelID
          field: channel_id
          type: integer
        - key: Frequency
          field: frequency
          type: frequency
        - key: PowerLevel
          field: power
          type: float
        - key: SymbolRate
          field: symbol_rate
          type: integer
        - key: Modulation
          field: modulation
          type: modulation
        - key: LockStatus
          field: lock_status
          type: lock_status
      filter:
        lock_status: locked
    # OFDMA upstream channels
    - array_path: data.exUSTbl
      channel_type:
        fixed: ofdma
      fields:
        - key: ChannelID
          field: channel_id
          type: integer
        - key: CentralFrequency
          field: frequency
          type: frequency
        - key: PowerLevel
          field: power
          type: float
        - key: BandWidth
          field: channel_width
          type: integer
        - key: LockStatus
          field: lock_status
          type: lock_status
      filter:
        lock_status: locked

system_info:
  sources:
    - format: json
      resource: /api/v1/system/ModelName
      fields:
        - key: ModelName
          field: model_name
          type: string
          path: data
    - format: json
      resource: /api/v1/system/CMStatus
      fields:
        - key: CMStatus
          field: docsis_status
          type: string
          map:
            OPERATIONAL: Operational
          path: data
    - format: json
      resource: /api/v1/system/CMStatus,ModelName,Manufacturer,SerialNumber,HardwareVersion,SoftwareVersion,UpTime,BootloaderVersion,CoreVersion,FirmwareName,FirmwareBuildTime,ProcessorSpeed,CMMACAddress,LocalTime,Hardware,MemTotal,MemFree,MTAMACAddress
      fields:
        - key: CMStatus
          field: docsis_status
          type: string
          map:
            OPERATIONAL: Operational
          path: data
        - key: ModelName
          field: model_name
          type: string
          path: data
        - key: HardwareVersion
          field: hardware_version
          type: string
          path: data
        - key: SoftwareVersion
          field: software_version
          type: string
          path: data
        - key: UpTime
          field: system_uptime
          type: uptime
          format: seconds
          path: data
        - key: MemTotal
          field: memory_total
          type: string
          path: data
        - key: MemFree
          field: memory_free
          type: string
          path: data

# DOCSIS 3.1: aggregate QAM-only totals. OFDM LDPC codewords operate
# at a vastly different scale and are not aggregated.
aggregate:
  total_corrected:
    sum: corrected
    channels: downstream.qam
  total_uncorrected:
    sum: uncorrected
    channels: downstream.qam
