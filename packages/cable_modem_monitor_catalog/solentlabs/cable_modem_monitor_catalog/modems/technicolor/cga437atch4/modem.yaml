manufacturer: Technicolor
model: CGA437ATCH4
transport: http
default_host: 192.168.0.1
timeout: 15

auth:
  strategy: form_pbkdf2
  login_endpoint: /api/v1/session/login
  cookie_name: auth
  csrf_header: X-CSRF-TOKEN
  login_busy:
    message: MSG_LOGIN_150
  login_success:
    error: ok
  pbkdf2_iterations: 1000
  pbkdf2_key_length: 128

session:
  headers:
    Referer: "{base_url}/"
    X-Requested-With: XMLHttpRequest
  post_login_endpoints:
    - /api/v1/session/menu

actions:
  logout:
    type: http
    method: POST
    endpoint: "/api/v1/session/logout"
    requires_session: true
    headers:
      X-Requested-With: "XMLHttpRequest"
    # HAR-observed: POST with the auth cookie and X-CSRF-TOKEN, no body;
    # answers {"error":"ok","message":"logged out"}. Single-session
    # firmware, so without it the next poll's login can collide with our
    # own session (MSG_LOGIN_150).
  restart:
    type: http
    method: POST
    endpoint: "/api/v1/reset"
    params:
      reboot: "Router,Wifi,VoIP,Dect,MoCA"
      ui_access: "reboot_device"
    headers:
      X-Requested-With: "XMLHttpRequest"
    # HAR-observed: the Restart button of /views/adm_reset.html. The page
    # reads GET /api/v1/reset first; the capture shows nothing on that
    # response the POST needs, so no pre_fetch_url. The modem answers
    # {"error":"ok","message":"all values saved","data":{"not_support":[],
    # "set_failure":[]}}. reboot is one field listing the subsystems.

hardware:
  docsis_version: "3.1"

status: awaiting_verification

sources:
  auth_config:
    "[#227 Technicolor CGA437ATCH4](https://github.com/solentlabs/cable_modem_monitor/issues/227)
    — two-step PBKDF2 login"
  isps:
    "[#227 Technicolor CGA437ATCH4](https://github.com/solentlabs/cable_modem_monitor/issues/227)
    — contributor reports Vectra (Poland)"
  logout_action:
    "[#227 Technicolor CGA437ATCH4](https://github.com/solentlabs/cable_modem_monitor/issues/227)
    — POST /api/v1/session/logout in the har-capture session"
  restart:
    "[#227 Technicolor CGA437ATCH4](https://github.com/solentlabs/cable_modem_monitor/issues/227)
    — POST /api/v1/reset in the har-capture session"

attribution:
  contributors:
    - github: https://github.com/blAkeOrfake
      contribution: "HAR capture and testing (Issue #227)"

isps:
  - Vectra

notes: |
  DOCSIS 3.1 gateway. Same REST platform as CGA4236: channels from /api/v1/modem/ and system info from /api/v1/system/.
  The firmware has no /api/v1/sta_* routes (the CGA6444VF resources answer 500).
  Downstream error counters sit in ErrTbl, not in the channel rows; they join
  the channels by row ordinal (SC-QAM) or ChannelIndex (OFDM). On the CGA4236
  fixture, where both tables carry the counters, that join reproduces every
  channel's own values.
  Login is the two-step PBKDF2 flow. A successful login answers message
  MSG_LOGIN_1, which the firmware's own translation table renders as an invalid
  login, so success is error == "ok" (login_success).

  A wrong password answers error "error" with message MSG_LOGIN_1 and
  data.failedAttempts; it did not lock the account in the capture.
  login_busy (MSG_LOGIN_150) is read from the firmware's login.html and
  lang/en.json in the capture; no busy response was captured.

  test_data/modem.har is the contributor's har-capture session (issue #227):
  login, status pages, logout, a wrong-password login mid-run, and a restart.
  Hand-applied redaction, by the contributor's account in the issue: the
  login username, SSID, LAN hostnames and non-empty comments were replaced
  with ***REDACTED***, because the sanitizer's review of those heuristic
  matches was skipped. Everything else is sanitizer output.
