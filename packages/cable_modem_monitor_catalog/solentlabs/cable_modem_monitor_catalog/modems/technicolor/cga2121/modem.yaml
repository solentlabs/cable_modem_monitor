manufacturer: Technicolor
model: CGA2121
transport: http
default_host: "192.168.100.1"

auth:
  strategy: form
  action: "/goform/logon"
  username_field: username_login
  password_field: password_login
  cookie_name: "sec"
  hidden_fields:
    language_selector: "en"

  success:
    redirect: "/basicUX.html"

hardware:
  docsis_version: "3.0"
  chipset: "Broadcom BCM3384ZU"
  release_date: "2017"

status: awaiting_verification

sources:
  auth_config: "[#75 Technicolor CGA2121](https://github.com/solentlabs/cable_modem_monitor/issues/75)"
  chipset: "[TechInfoDepot Technicolor CGA2121](https://techinfodepot.shoutwiki.com/wiki/Technicolor_CGA2121) (read 2026-10-20): Broadcom BCM3384ZU, FCC ID N89-CGA2121. The earlier FCC link (ID RUI-CGA2121COM) is a grantee code that belongs to another company and has no CGA2121 record."

  detection_hints: "[#75 Technicolor CGA2121](https://github.com/solentlabs/cable_modem_monitor/issues/75)"
  release_date: "Changed from 2015, which had no source (original entry 6da3d83e), to 2017, the year of the earliest dated evidence; the device was on sale by then and may be older. Read 2026-10-20: the first post in a [Telia community thread about the CGA2121](https://yhteiso.telia.fi/kiinteae-netti-8/technicolor-cga2121-kokemukset-29137) is dated 2017-12-13, and [FCC ID N89-CGA2121](https://fccid.io/N89-CGA2121) shows its first final action on 2018-03-30."
  isps: "[#75](https://github.com/solentlabs/cable_modem_monitor/issues/75) reporter's ISP is Telia (Finland). Telia Finland publishes a [CGA2121 user guide](https://www.telia.fi/asiakastuki/laitteet/technicolor-cga2121) (read 2026-10-20)."

attribution:
  contributors:
    - github: https://github.com/sgofferj
      contribution: "HAR capture and initial fixture data"

isps:
  - Telia

notes: |
  DOCSIS 3.0 Wireless Gateway (combo modem/router) for Telia Finland.
  24 downstream channels and 4 upstream channels.
  Known limitations:
  - No frequency data exposed in status page
  - No codeword counts exposed in status page
  Form-based authentication to /goform/logon endpoint.

references:
  issues:
    - "[#75 — [Modem Request] Technicolor CGA2121](https://github.com/solentlabs/cable_modem_monitor/issues/75)"
