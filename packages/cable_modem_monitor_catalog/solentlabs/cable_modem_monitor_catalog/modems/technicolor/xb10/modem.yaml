manufacturer: Technicolor
model: XB10
model_aliases:
  - "CGM601TCOM"
brands:
  - "Xfinity"
transport: http
default_host: "10.0.0.1"
timeout: 15

auth:
  strategy: form
  action: "/check.jst"
  username_field: username
  password_field: password
  cookie_name: "DUKSID"
  success:
    redirect: "/at_a_glance.jst"

actions:
  logout:
    type: http
    method: GET
    endpoint: "/home_loggedout.jst"
    # source_inferred from global.js (not observed in HAR traffic).
    # requires_session not set (defaults to false) — pending contributor confirmation
    # whether a Cookie header appears in the logout request.
  restart:
    type: http
    method: POST
    endpoint: "/actionHandler/ajaxSet_Reset_Restore.jst"
    params:
      resetInfo: '["btn1","Device","admin"]'
      csrfp_token: "{cookie:csrfp_token}"
    # endpoint source_inferred from restore_reboot.jst inline JS (not observed in HAR).
    # csrfp_token: OWASP CSRFP — token is session-scoped, issued by the login
    # redirect (/at_a_glance.jst). No pre_fetch_url needed; token is already in
    # the session jar. POST body echoes it. Needs contributor confirmation on hardware.

hardware:
  docsis_version: "4.0"
  chipset: "Broadcom BCM33941UD"
  release_date: "2025"

status: confirmed

sources:
  release_date: "[Xfinity Community Forum, May 2025](https://forums.xfinity.com/conversations/customer-service/xb10-availability/6814de85ce99874d94b358f6) — official Xfinity replies confirm XB10 available to X-Class (FDX DOCSIS 4.0) customers with phased rollout in 2025; [FCC grant for CGM601TCOM (G95601TX)](https://fcc.report/FCC-ID/G95601TX) 2025-02-14"
  brands: "[Xfinity gateway comparison](https://forums.xfinity.com/conversations/internet/answered-comcast-modem-wireless-gateway-devicefeature-comparison/602da6d1c5375f08cdd28eeb)"
  model_aliases: "[Xfinity XB10 = CGM601TCOM](https://forums.xfinity.com/conversations/internet/answered-comcast-modem-wireless-gateway-devicefeature-comparison/602da6d1c5375f08cdd28eeb)"
  auth_config: "[#173 Technicolor XB10](https://github.com/solentlabs/cable_modem_monitor/issues/173)"
  chipset:
    "[HighSpeedInternet.com — Xfinity XB10 DOCSIS 4.0 / Wi-Fi 7 gateway](https://www.highspeedinternet.com/resources/xfinity-docsis4-wifi7-gateway)
    — names BCM33941UD; no official Broadcom product page or teardown to independently
    confirm the part number. Primary source confirms Broadcom unified DOCSIS 4.0
    chipset:
    [Comcast / Broadcom press release (Oct 2023)](https://corporate.comcast.com/press/releases/comcast-broadcom-develop-ai-powered-access-network-pioneering-new-chipset)"
  docsis_version:
    "[Comcast / Broadcom press release (Oct 2023)](https://corporate.comcast.com/press/releases/comcast-broadcom-develop-ai-powered-access-network-pioneering-new-chipset)
    — BCM33941UD is Broadcom's unified DOCSIS 4.0 chipset; [Xfinity Community
    Forum, May 2025](https://forums.xfinity.com/conversations/customer-service/xb10-availability/6814de85ce99874d94b358f6)
    — XB10 ships to X-Class (FDX DOCSIS 4.0) customers. Corroborated by the
    fixture HAR (#173): locked upstream OFDMA at 105/200/297 MHz, beyond the
    204 MHz high-split upstream ceiling
    ([CableLabs, Band Splits 101](https://www.cablelabs.com/blog/band-splits-splitting-our-way-to-10g)
    — high-split extends upstream to 204 MHz) and inside DOCSIS 4.0's FDX
    upstream band of 108-684 MHz
    ([Averna, DOCSIS 4.0 Overview](https://insight.averna.com/en/resources/blog/the-flavors-of-docsis-4-0)
    — 'The frequency range for FDX mode is 108 MHz to 1218 MHz downstream
    and 5-85 MHz and 108-684 MHz upstream'; governing spec CM-SP-PHYv4.0,
    [CableLabs DOCSIS 4.0](https://www.cablelabs.com/technologies/docsis-4-0-technology)).
    [FCC ID G95601TX](https://fccid.io/G95601TX) confirms the CGM601TCOM filing."
  error_codewords: "[#173](https://github.com/solentlabs/cable_modem_monitor/issues/173) capture (test_data/modem.har) and modem.verified.json; the same first-column duplication on the XB6 in [Xfinity Community, April 2020](https://forums.xfinity.com/conversations/your-home-network/correctable-codewords-50-of-codewords-on-2-channels/602daed0c5375f08cdf6df9e) (index 1 equals index 33) and the XB7 in [DSLReports, November 2021](https://www.dslreports.com/forum/r33254515-Connectivity-Seeing-nearly-as-many-Correctable-as-Unerrored-Codewords-on-Ch1) (index 1 equals index 32); the page pairs Channel IDs with CMErrorCodewords counters by row index in the [RDK-B web UI template](https://github.com/rdkcentral/webui/blob/8ac407e5f75f243a8d01615d664b2e6e61522b8b/source/Styles/xb6/jst/network_setup.jst#L1073-L1107)"

attribution:
  contributors:
    - github: https://github.com/chilicheech
      contribution: "HAR capture (Issue #173)"

isps:
  - Xfinity

notes: |
  DOCSIS 4.0 hardware (BCM33941UD) on Xfinity with FDX upstream active:
  the fixture capture shows locked upstream OFDMA at 105/200/297 MHz —
  FDX-band frequencies beyond DOCSIS 3.1's 204 MHz upstream ceiling
  (an earlier note claiming "provisioned in DOCSIS 3.1 mode" predated
  this reading of the channel data). Downstream shape is standard 3.1:
  SC-QAM at 957-999 MHz plus OFDM at 774/1086 MHz, under 1218 MHz.
  Processor speed: 1701 MHz (BCM33941UD, hardware-fixed; documented here, not parsed as a live sensor).
  Same .jst page platform as XB6 (CGM4140COM) / XB7 (CGM4331COM).
  Transposed table format: rows are metrics, columns are channels.
  Session cookie: DUKSID. CSRF: csrfp_token (OWASP CSRFP).
  Default IP: 10.0.0.1 (router mode).
  Error codeword duplication: the first data column of the CM Error
  Codewords table repeats the last column's unerrored, correctable and
  uncorrectable counts, here QAM channel 17 and OFDM channel 194. The
  first column is the primary channel, and its own counts never reach
  the page, so parser.yaml skips that column and the QAM totals sum the
  remaining QAM channels.
  OFDM downstream frequencies reported in Hz without unit suffix (e.g.,
  "774000000") rather than in MHz like QAM channels; stored as-is in Hz.
  System uptime format: "X days Xh: Xm: Xs" (spaces after colons);
  uptime parser handles this via flexible whitespace matching.
  The factory Wi-Fi SSID, default password and serial number in the
  Device Label Information block on network_setup.jst were redacted by
  hand, along with the SSID where it repeats on connection_status.jst
  and the wireless config page: har-capture had no labeled-credential
  detector at capture time.

references:
  issues:
    - "[#173 — [Modem Request] Xfinity XB10 / Technicolor CGM601TCOM](https://github.com/solentlabs/cable_modem_monitor/issues/173)"
