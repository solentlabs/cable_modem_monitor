downstream:
  format: table_transposed
  resource: "/network_setup.jst"
  tables:
    - channel_type:
        field: modulation
        map:
          "QAM256": "qam"
          "OFDM": "ofdm"

      rows:
        - field: channel_id
          label: "Channel ID"
          type: integer
        - field: lock_status
          label: "Lock Status"
          type: lock_status
        - field: frequency
          label: "Frequency"
          type: frequency
          unit: "MHz"
        - field: snr
          label: "SNR"
          type: float
          unit: "dB"
        - field: power
          label: "Power Level"
          type: float
          unit: "dBmV"
        - field: modulation
          label: "Modulation"
          type: string
          map:
            "256 QAM": "QAM256"
      selector:
        match: "Downstream"
        type: header_text
    - merge_by:
        - channel_id
      # The first data column repeats the last column's counters in every
      # capture, so the primary channel's own counts never appear. The
      # evidence is in modem.yaml notes and sources.error_codewords.
      skip_columns:
        - 0
      rows:
        - field: channel_id
          label: "Channel ID"
          type: integer
        - field: corrected
          label: "Correctable Codewords"
          type: integer
        - field: uncorrected
          label: "Uncorrectable Codewords"
          type: integer

      selector:
        match: "CM Error Codewords"
        type: header_text

upstream:
  format: table_transposed
  resource: "/network_setup.jst"
  # channel_type is read from the Channel Type row. docsIfUpChannelType
  # (DOCS-IF-MIB, RFC 4546) has no OFDMA value and DOCS-IF31-MIB defines
  # no channel type field, so the firmware gives OFDMA channels the SC-QAM
  # fallback "TDMA". "TDMA_AND_ATDMA" appears in the XB7 capture, not
  # this one; the row stays as part of the .jst platform's value set
  # (PARSING_SPEC § Channel Type Detection).
  #
  # Modulation is not published: the firmware shows a bare "QAM" with no
  # constellation order, which PARSING_SPEC requires the parser to omit.
  rows:
    - field: channel_id
      label: "Channel ID"
      type: integer
    - field: lock_status
      label: "Lock Status"
      type: lock_status
    - field: frequency
      label: "Frequency"
      type: frequency
      unit: "MHz"
    - field: power
      label: "Power Level"
      type: float
      unit: "dBmV"
    - field: channel_type
      label: "Channel Type"
      type: string
      map:
        "TDMA_AND_ATDMA": "atdma"
        "ATDMA": "atdma"
        "TDMA": "ofdma"
    - field: symbol_rate
      label: "Symbol Rate"
      type: integer
      scale: 1000 # ksym/s → Sym/s
  selector:
    match: "Upstream"
    type: header_text

system_info:
  sources:
    - format: html_fields
      resource: "/network_setup.jst"
      fields:
        - field: system_uptime
          label: "System Uptime"
          type: uptime
          format: "{days} days {hours}h:{minutes}m:{seconds}s"
        - field: software_version
          label: "Download Version"
          type: string
        - field: downstream_status
          label: "Acquire Downstream Channel"
          type: string
          map:
            "Complete": "Operational"
        - field: upstream_status
          label: "Upstream Ranging"
          type: string
          map:
            "Complete": "Operational"
        - field: hardware_version
          label: "HW Version"
          type: string
        - field: model_name
          label: "Model"
          type: string

# QAM-only totals (PARSING_SPEC § Aggregate). The skipped first error
# column leaves the primary channel without counters, so it is not summed.
aggregate:
  total_corrected:
    sum: corrected
    channels: downstream.qam
  total_uncorrected:
    sum: uncorrected
    channels: downstream.qam

computed:
  docsis_status:
    operation: combined_status
    inputs:
      ds: downstream_status
      us: upstream_status
