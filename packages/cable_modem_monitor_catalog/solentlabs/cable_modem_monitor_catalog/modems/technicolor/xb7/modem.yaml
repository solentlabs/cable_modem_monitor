notes: |
  DOCSIS 3.1 cable modem and router gateway (CGM4331COM). Default IP
  10.0.0.1 (router mode) or 192.168.100.1 (modem mode). Form login posts
  to /check.jst. Tables are transposed: rows are metrics, columns are
  channels. Uptime reads "X days Xh: Xm: Xs" (note the spaces after the
  colons). May have localized variants (Italian translations found in
  the Rogers/Italian market).

  The first data column of the CM Error Codewords table repeats the last
  column's counts (QAM channel 17 and OFDM channel 34 in
  test_data/modem.verified.json). That column is the primary channel,
  whose own counts never reach the page, so parser.yaml skips it and the
  QAM totals sum the remaining QAM channels.

  Assembled fixture, not a full wire capture. Only the /network_setup.jst
  response is a real har-capture; the /check.jst login and the
  /at_a_glance.jst landing are hand-built. The login's 302 Location is the
  modem's own. The landing's 200 is inferred from that redirect and from
  the XB6 and XB10 captures (same firmware family), which both serve
  /at_a_glance.jst 200; its body is left empty rather than invented, since
  parser.yaml reads only /network_setup.jst. Unobserved on this unit: the
  landing body and headers, the check.jst POST mechanics and the session
  cookie. The factory Wi-Fi SSID and default password in the Device Label
  Information block on network_setup.jst were redacted by hand: har-capture
  had no labeled-credential detector at capture time.

  cookie_name "session" is unobserved. The XB6, XB8 and XB10 captures in
  test_data and the RDK-B web UI
  ([home_loggedout.jst](https://github.com/rdkcentral/webui/blob/8ac407e5f75f243a8d01615d664b2e6e61522b8b/source/Styles/xb3/jst/home_loggedout.jst#L68))
  all set DUKSID. It stays "session" because the confirmed setup ran with
  it, logging in on every poll.

  status: confirmed rests on test_data/modem.verified.json (CGM4331COM,
  34 downstream, 5 upstream, docsis_status Operational), not on this
  fixture. Replace the fixture with a real full-session HAR when an XB7
  owner contributes one.

