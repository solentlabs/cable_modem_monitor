  release_date: "[DSLReports thread, Wayback capture 2022-03-22](https://web.archive.org/web/20220322015832/https://www.dslreports.com/forum/r32469291-Equip-XB7-Technicolor-CGM4331COM-Arris-TG4482-Wireless-AX-Wi-Fi-6): a 2019-12-09 post says the gateway is in a limited market trial and 'will be launched nationally in 2020'. [Light Reading, 2019-12-10](https://www.lightreading.com/cable/comcast-tests-25-gig-gateway/d/d-id/756190): Comcast teamed with Technicolor on the XB7. Comcast announced a next-generation gateway at CES 2020 ([SpeedGuide, 2020-01-06](https://speedguide.net/news/comcast-announces-xfinity-wi-fi-6-certified-gateway-7137); [Help Net Security, 2020-01-09](https://www.helpnetsecurity.com/2020/01/09/comcast-xfi-advanced-gateway/): rolling out 'in the coming months'); neither page names the XB7."
