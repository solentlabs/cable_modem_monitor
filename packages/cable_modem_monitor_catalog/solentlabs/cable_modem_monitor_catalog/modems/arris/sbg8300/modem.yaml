manufacturer: ARRIS
model: SBG8300
brands:
  - "SURFboard"
transport: http
default_host: "192.168.0.1"

auth:
  strategy: bearer
  login_endpoint: "/actionHandler/ajaxSet_login.php"
  method: PUT
  cookie_name: "PHPSESSID"
  token_source: header
  token_header: "X-CSRF-Token"
  token_placement: header
  login_busy:
    session_overtake: true

session:
  headers:
    X-Requested-With: "XMLHttpRequest"

actions:
  logout:
    type: http
    method: PUT
    endpoint: "/actionHandler/ajaxSet_logout.php"
    requires_session: true
  restart:
    type: http
    method: PUT
    endpoint: "/actionHandler/ajaxSet_Reset_Restore.php"
    json_body:
      action: "restart"
      module: "gateway"

hardware:
  docsis_version: "3.1"
  chipset: "Intel Puma 7 (FHCE2752M)"

detection:
  http_headers:
    - "ARRIS Server"

status: confirmed

sources:
  auth_config: "test_data/modem.har — login.php [2] PUTs {username, password}
    (encryptParametersIfNeeded is disabled), handles session_overtake and
    keeps the X-CSRF-Token response header; at_a_glance.php [29]
    $.ajaxSetup sends it back as a request header; [27] rejected login
    409; [28] [513] accepted login, Set-Cookie PHPSESSID and X-CSRF-Token"
  logout_action:
    "test_data/modem.har — logout() in at_a_glance.php [29]; [440] [607]
    PUT with the PHPSESSID cookie and X-CSRF-Token, 200"
  restart_action:
    'test_data/modem.har — restore_reboot.php [413] builds {action:
    ''restart'', module: ''gateway''} and setResetInfo() PUTs it; [439]
    plaintext PUT with the PHPSESSID cookie and X-CSRF-Token, 200
    {"reboot_gateway":true}'
  session_headers:
    "test_data/modem.har — X-Requested-With: XMLHttpRequest on the login
    [27] [28], logout [440] and restart [439] requests (jQuery $.ajax)"
  brands: "test_data/modem.har [82] wan.php — footer link reads SURFboard"
  docsis_version: "[ABT product listing, DOCSIS Version 3.1](https://www.abt.com/ARRIS-SURFboard-DOCSIS-3.1-Gigabit-Cable-Modem-Wi-Fi-Router-SBG8300/p/146268.html)"
  chipset: "[DeviWiki, Arris SBG8300](https://deviwiki.com/wiki/Arris_SBG8300)"
  isps: "[Amazon listing, Comcast Xfinity, Cox, Spectrum](https://www.amazon.com/ARRIS-Surfboard-SBG8300-RB-Approved-Spectrum/dp/B098PFNQV3)"

attribution:
  contributors:
    - github: https://github.com/kwschulz
      contribution: "Bench HAR captures (2026-09-25 unprovisioned, 2026-10-12 coax-connected; HW 6, SW 01.02.078.04.NCS)"

isps:
  - Comcast
  - Cox
  - Spectrum

notes: |
  ARRIS SURFboard SBG8300 gateway, firmware 01.02.078.04.NCS, HW 6.
  HTTPS actionHandler web UI, the same PHP family as arris/tg3442s but
  with parameter encryption switched off, so the login is plaintext.
  Captured on the maintainer's bench unit, connected to a coax line and
  provisioned (cm_status OPERATIONAL).
  Entry indices below are into test_data/modem.har.

  Login: bearer. login.php PUTs {"username","password"} to
  ajaxSet_login.php, nothing else. Wrong credentials answer 409 "Invalid
  Login Credentials!" [27]; a separate bench capture shows three
  consecutive wrong passwords each answering the same 409. The accepted
  login [28] answers 200 with an empty body, Set-Cookie PHPSESSID and an
  X-CSRF-Token header that every later XHR sends back. When another
  session is active the login JS answers {"session_overtake": true} and
  offers a takeover through ajaxSet_SessionActive.php; not observed in
  the HAR. login_busy reads that answer as busy and Core never sends the
  takeover. One admin session at a time; logout runs after every poll.

  Data: everything comes from the channelData object in wan.php [82].
  cm_status is OPERATIONAL: ds_channels has 32 QAM rows, all Locked;
  ofdm_channels 2, both Locked; us_channels 4 (1 ACTIVE, 3 DISABLE);
  ofdma_channels 1 (SUCCESS). The page builds its QAM tables only from
  rows whose Modulation contains "QAM" (createDataTable); the parser does
  not filter. error_codewords (32 rows) has no ChannelID and cannot merge
  into channels, so total_corrected and total_uncorrected are not mapped.
  OFDM and OFDMA first/last active subcarrier and the pilot and PLC MER
  are unregistered fields and not mapped; the OFDMA SymbolRate (12) has no
  unit. Core's lock_status type reads ACTIVE as locked but not DISABLE or
  SUCCESS, so the golden records the ofdma row as not_locked with no
  signal values. The 2026-10-14 diagnostics (modem.verified.json, 16
  minutes of uptime, docsis_status Operational) show 34 downstream
  and 4 ATDMA upstream channels locked with full fields and the ofdma
  row still not_locked; they carry no raw LockStatus, so whether the
  channel is working is not observed. system_info comes
  from the Cable Modem block and System Uptime row of wan.php (DOCSIS
  Operating Mode is mapped as reported, 3.1). software_version is its
  Download Version row, which matches the Firmware Version row of
  software.php [112].

  Restart: restore_reboot.php sends {action: 'restart', module:
  'gateway'} as plaintext JSON [439]. The reboot outage follows
  ([441]-[512]) and the unit accepts a new login at [513]. Every page
  load also POSTs ajaxSet_SessionActive.php (keep-alive); polling does
  not need it.

  Bench test (2026-09-25, same unit, no cable signal): login, the
  wan.php fetch and logout ran on every poll, and restart rebooted the
  unit. After the restart the modem answered session_overtake for about
  ten minutes, then logins succeeded again. Core read it as busy and
  recovered without a takeover.

  Bench soak (2026-10-01 to 10-02, same unit): two more restarts were
  each back within three minutes, with one session_overtake on the poll
  right after the command; the ten-minute window did not recur. A power
  cycle came back with no busy answer. Once the web UI hung for over
  three hours; a restart sent then timed out without rebooting.
  Those runs had no cable signal: every downstream row was unlocked.

  Web-server hang (bench runs 2026-10-02 to 10-08, same unit): TCP, TLS
  and ping keep answering but no HTTP request is answered, even for a
  nonexistent path, for 150 s or more. It did not clear in 60 minutes
  with no traffic; only a power cycle clears it. Only ports 53, 80 and
  443 answer, and SNMP v2c and v3 got no reply. The first failing request
  is a stalled wan.php body right after a login. A plain script with no
  CMM code reproduced it in 14 of 24 runs of back-to-back wan.php
  fetches on one session, about one hang per 2,800 fetches; the length
  of the power-off before a run made no detectable difference. Cause
  unknown.

  Build: software.php [112] reports RDK-B-LLC rdkb-20171127. The
  opensource.php footer page, not in the HAR, lists lighttpd 1.4.33 and
  PHP 5.4.14.

  Hand-applied sanitization: the TLS certificate subjectName (the
  device's bare-hex identifier) is replaced with same-length X on every
  HTTPS entry, as in the fleet fixtures; har-capture masks headers and
  cookies but not _securityDetails. Nothing else differs from the
  capture.
