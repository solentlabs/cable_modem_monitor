manufacturer: ARRIS
model: SBG8300
brands:
  - "SURFboard"
transport: http
default_host: "192.168.0.1"

auth:
  strategy: bearer
  login_endpoint: "/actionHandler/ajaxSet_login.php"
  method: PUT
  cookie_name: "PHPSESSID"
  token_source: header
  token_header: "X-CSRF-Token"
  token_placement: header
  login_busy:
    session_overtake: true

session:
  headers:
    X-Requested-With: "XMLHttpRequest"

actions:
  logout:
    type: http
    method: PUT
    endpoint: "/actionHandler/ajaxSet_logout.php"
    requires_session: true
  restart:
    type: http
    method: PUT
    endpoint: "/actionHandler/ajaxSet_Reset_Restore.php"
    json_body:
      action: "restart"
      module: "gateway"

hardware:
  docsis_version: "3.1"
  chipset: "Intel Puma 7 (FHCE2752M)"

status: awaiting_verification

sources:
  auth_config: "test_data/modem.har — login.php [2] lines 731-748 PUT {username,
    password} (encryptParametersIfNeeded is disabled, line 235), session
    overtake branch, X-CSRF-Token kept from the response header;
    at_a_glance.php [29] lines 321-325 $.ajaxSetup sends it back as the
    X-CSRF-Token request header; [27] rejected login 409; [28] [775]
    accepted login, Set-Cookie PHPSESSID and X-CSRF-Token"
  logout_action:
    "test_data/modem.har — logout() in at_a_glance.php [29] lines 761-768;
    [698] [802] PUT with the PHPSESSID cookie and X-CSRF-Token, 200"
  restart_action:
    'test_data/modem.har — restore_reboot.php [671] line 842 builds
    {action: ''restart'', module: ''gateway''} and setResetInfo() (line 933)
    PUTs it; [697] plaintext PUT with the PHPSESSID cookie and
    X-CSRF-Token, 200 {"reboot_gateway":true}'
  session_headers:
    "test_data/modem.har — X-Requested-With: XMLHttpRequest on the login
    [27] [28], logout [698] and restart [697] requests (jQuery $.ajax)"
  brands: "test_data/modem.har [84] wan.php — footer link reads SURFboard"
  docsis_version: "[ABT product listing, DOCSIS Version 3.1](https://www.abt.com/ARRIS-SURFboard-DOCSIS-3.1-Gigabit-Cable-Modem-Wi-Fi-Router-SBG8300/p/146268.html)"
  chipset: "[DeviWiki, Arris SBG8300](https://deviwiki.com/wiki/Arris_SBG8300)"
  isps: "[Amazon listing, Comcast Xfinity, Cox, Spectrum](https://www.amazon.com/ARRIS-Surfboard-SBG8300-RB-Approved-Spectrum/dp/B098PFNQV3)"

attribution:
  contributors:
    - github: https://github.com/kwschulz
      contribution: "Bench HAR captures (2026-09-25, HW 6, SW 01.02.078.04.NCS)"

isps:
  - Comcast
  - Cox
  - Spectrum

notes: |
  ARRIS SURFboard SBG8300 gateway, firmware 01.02.078.04.NCS, HW 6.
  HTTPS actionHandler web UI, the same PHP family as arris/tg3442s but
  with parameter encryption switched off, so the login is plaintext.
  Captured on the maintainer's unprovisioned bench unit.
  Entry indices below are into test_data/modem.har.

  Login: bearer. login.php PUTs {"username","password"} to
  ajaxSet_login.php with no other keys. Wrong credentials answer 409
  "Invalid Login Credentials!" [27]; a separate bench capture shows three
  consecutive wrong passwords each answering the same 409. The accepted
  login [28] answers 200 with an empty body, Set-Cookie PHPSESSID and the
  X-CSRF-Token header, which every later XHR sends back as a request
  header. The login JS answers {"session_overtake": true} when another
  session is active and then offers a takeover through
  ajaxSet_SessionActive.php; not observed. login_busy reads that answer
  as busy and Core never sends the takeover. Single admin session at a
  time; logout runs after every poll.

  Data: everything comes from wan.php [84]. Channels are the channelData
  object (line 751). The unit is unprovisioned (cm_status
  NOT_SYNCHRONIZED): ds_channels holds 17 rows, every one ChannelID 0,
  Modulation UNSUPPORTED and NotLocked, so the golden carries 17 unlocked
  channels and no signal values. The page shows only ds_channels rows
  whose Modulation contains "QAM"; the parser does not filter. The
  us_channels, ofdm_channels and ofdma_channels arrays were empty and
  nothing on the page names their keys, so they are not mapped. The four
  error_codewords rows carry no ChannelID and are not mapped. The
  channel mappings are unverified until a provisioned capture exists.
  system_info comes from the page's Cable Modem block and System Uptime
  row; DOCSIS Operating Mode reads "unknown" while unprovisioned and is
  mapped as reported. software_version is the Download Version row, which
  matches software.php's Firmware Version [167].

  Restart: restore_reboot.php sends {action: 'restart', module:
  'gateway'} as plaintext JSON [697]; the reboot outage follows
  ([699]-[709]) and the unit accepts a new login at [775].
  Every page load also POSTs ajaxSet_SessionActive.php (keep-alive);
  polling does not need it.

  Bench test (2026-09-25, same unit, no cable signal): login, the
  wan.php fetch and logout ran on every poll, and restart rebooted the
  unit. After the restart the modem answered session_overtake for about
  ten minutes, then logins succeeded again. Core read it as busy and
  recovered without a takeover.
  Signal mappings are unexercised: every downstream row was unlocked.

  Hand-applied sanitization: the TLS certificate subjectName (the
  device's bare-hex identifier) is replaced with same-length X on every
  HTTPS entry, as in the fleet fixtures; har-capture masks headers and
  cookies but not _securityDetails. Nothing else differs from the
  capture.
