# wan.php assigns every channel array to one object (modem.har [84],
# line 751): let channelData = {ds_channels, us_channels, ofdm_channels,
# ofdma_channels, error_codewords, cm_status}. Frequencies are Hz (table
# header "Frequency (Hz)").
#
# Only ds_channels is mapped. us_channels, ofdm_channels and
# ofdma_channels were empty in the capture and nothing on the page names
# their keys. error_codewords rows carry no ChannelID, so they cannot be
# merged into channels.

downstream:
  format: javascript_json
  resource: "/wan.php"
  variable: "channelData"
  arrays:
    - array_path: "ds_channels"
      channel_type:
        fixed: "qam"
      mappings:
        - key: ChannelID
          field: channel_id
          type: integer
        - key: Frequency
          field: frequency
          type: frequency
        - key: PowerLevel
          field: power
          type: float
        - key: SNRLevel
          field: snr
          type: float
        - key: Modulation
          field: modulation
          type: modulation
        - key: LockStatus
          field: lock_status
          type: lock_status

system_info:
  sources:
    - format: html_fields
      resource: "/wan.php"
      fields:
        - label: "System Uptime"
          field: system_uptime
          type: uptime
          format: "{days}d {hours}h {minutes}m {seconds}s"
        - label: "Download Version"
          field: software_version
          type: string
        - label: "HW Version"
          field: hardware_version
          type: string
        - label: "Model"
          field: model_name
          type: string
        - label: "DOCSIS Operating Mode"
          field: docsis_version
          type: string
