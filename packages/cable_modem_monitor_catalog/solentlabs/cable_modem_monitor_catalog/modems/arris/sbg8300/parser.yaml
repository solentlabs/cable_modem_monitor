# wan.php assigns every channel array to one object (test_data/modem.har
# [82]): let channelData = {ds_channels, us_channels, ofdm_channels,
# ofdma_channels, error_codewords, cm_status}. Frequencies are Hz (table
# header "Frequency (Hz)").
#
# error_codewords rows have no ChannelID, so they cannot merge into
# channels and total_corrected / total_uncorrected are not declared.
# OFDM and OFDMA first/last active subcarrier and pilot MER are
# unregistered fields and not mapped; the OFDMA SymbolRate (12) has no unit.

downstream:
  format: javascript_json
  resource: "/wan.php"
  variable: "channelData"
  arrays:
    - array_path: "ds_channels"
      channel_type:
        fixed: "qam"
      mappings:
        - key: ChannelID
          field: channel_id
          type: integer
        - key: Frequency
          field: frequency
          type: frequency
        - key: PowerLevel
          field: power
          type: float
        - key: SNRLevel
          field: snr
          type: float
        - key: Modulation
          field: modulation
          type: modulation
        - key: LockStatus
          field: lock_status
          type: lock_status
    - array_path: "ofdm_channels"
      channel_type:
        fixed: "ofdm"
      mappings:
        - key: ChannelID
          field: channel_id
          type: integer
        - key: FftType
          field: fft_type
          type: string
        - key: ChannelWidth
          field: channel_width
          type: frequency
        - key: NumActiveSubcarrier
          field: active_subcarriers
          type: integer
        # Average RxMER of the data subcarriers; the page also reports
        # pilot and PLC averages.
        - key: DataScAvgMer
          field: snr
          type: float
        - key: Power
          field: power
          type: float
        - key: Modulation
          field: modulation
          type: modulation
        - key: LockStatus
          field: lock_status
          type: lock_status

upstream:
  format: javascript_json
  resource: "/wan.php"
  variable: "channelData"
  arrays:
    - array_path: "us_channels"
      channel_type:
        fixed: "atdma"
      mappings:
        - key: ChannelID
          field: channel_id
          type: integer
        - key: Frequency
          field: frequency
          type: frequency
        - key: PowerLevel
          field: power
          type: float
        - key: SymbolRate
          field: symbol_rate
          type: integer
          scale: 1000
          unit: "KSym/sec"
        - key: Modulation
          field: modulation
          type: modulation
        - key: LockStatus
          field: lock_status
          type: lock_status
    - array_path: "ofdma_channels"
      channel_type:
        fixed: "ofdma"
      mappings:
        - key: ChannelID
          field: channel_id
          type: integer
        - key: Power
          field: power
          type: float
        - key: Modulation
          field: modulation
          type: modulation
        - key: LockStatus
          field: lock_status
          type: lock_status

system_info:
  sources:
    - format: html_fields
      resource: "/wan.php"
      fields:
        - label: "System Uptime"
          field: system_uptime
          type: uptime
          format: "{days}d {hours}h {minutes}m {seconds}s"
        - label: "Download Version"
          field: software_version
          type: string
        - label: "HW Version"
          field: hardware_version
          type: string
        - label: "Model"
          field: model_name
          type: string
        - label: "DOCSIS Operating Mode"
          field: docsis_version
          type: string
