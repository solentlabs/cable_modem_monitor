notes: |
  8x4 channel modem. HW 7.0 and HW 8.0 confirmed on firmware
  SB_KOMODO-1.0.7.3-SCM02-NOSH. test_data/modem.har is a full browser
  capture of a HW 8.0 unit on that firmware (October 2026, har-capture
  --minimal since there is no login); entry indices are into it.

  The codewords table title differs by firmware: 1.0.7.3-SCM02 reports
  "Signal Status (Codewords)", 1.0.7.0-SCM00 "Signal Stats (Codewords)"
  (#177). parser.yaml matches both.

  No restart action: the restart page exists only while the modem is
  offline. The April 2026 HW 7.0 and HW 8.0 captures (not committed), taken
  at "Cable Modem Status: Offline", hold GET
  /reset.htm?reset_modem=Restart+Cable+Modem answering 200 and a "Restart
  Cable Modem" form at the foot of cmConfigData.htm. This capture is online
  (indexData.htm [2]: "Operational"): cmConfigData.htm [17] has neither that
  form nor the factory-default note, and GET /reset.htm and the reset_modem
  URL both answer 404. No other capture or user report shows a restart on
  an online SB6141. A bench run on 2026-10-14 (not committed; one HW 8.0
  unit, same firmware) followed the modem's state. Offline, a GET /reset.htm
  rebooted the unit. Within one poll of Operational the form, the note and
  the page were gone. Removing the coax restored them, and the unit
  restarted itself about a minute later. It went straight from Offline to
  Operational, so link state and provisioning are not separated.
