notes: |
  DOCSIS 3.0 8x4 cable modem (released 2011, EOL 2019). Broadcom BCM3380.
  No authentication required; the status page is publicly accessible.
  Transposed table layout (rows = metrics, columns = channels).
  The codewords (error-count) table title differs by firmware: 1.0.7.3-SCM02
  reports "Signal Status (Codewords)", 1.0.7.0-SCM00 reports "Signal Stats
  (Codewords)" (#177). parser.yaml matches both observed titles explicitly via
  selector fallback.
  system_info from cmHelpData.htm (firmware, HW version) and indexData.htm (uptime).
  HW 7.0 and HW 8.0 confirmed on firmware SB_KOMODO-1.0.7.3-SCM02-NOSH.
  test_data/modem.har is a full browser capture of a HW 8.0 unit on the same
  firmware (October 2026; har-capture --minimal, since the modem needs no
  login); entry indices are into it.

  No restart action. The April 2026 HW 7.0 and HW 8.0 captures (not
  committed), both taken with the modem offline ("Cable Modem Status:
  Offline"), hold GET /reset.htm?reset_modem=Restart+Cable+Modem answering
  200 and a "Restart Cable Modem" form at the foot of cmConfigData.htm. This
  capture was taken with the modem online on cable (indexData.htm [2]:
  "Operational"); its cmConfigData.htm [17] has neither that form nor the
  factory-default note, and both GET /reset.htm and GET
  /reset.htm?reset_modem=Restart+Cable+Modem answered 404 on that unit. No
  other capture or user report shows a restart on an online SB6141. Why the
  page is absent online is not established (provisioning is one possibility).
  A capture from an online unit that shows the form would restore the action.

references:
  prs:
    - "[PR #57 — Added support for Arris CM820B modem.](https://github.com/solentlabs/cable_modem_monitor/pull/57)"
