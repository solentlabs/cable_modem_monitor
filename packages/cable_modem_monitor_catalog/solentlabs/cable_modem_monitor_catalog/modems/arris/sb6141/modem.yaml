manufacturer: ARRIS
model: SB6141
brands:
  - "SURFboard"
  - "Motorola"
transport: http
default_host: "192.168.100.1"

auth:
  strategy: none

hardware:
  docsis_version: "3.0"
  chipset: "Intel Puma 5"
  end_of_life: "2022"
  release_date: "2011"

status: confirmed

sources:
  auth_config: "Real hardware captures (HW 7.0 + HW 8.0, April 2026) — no login required"
  brands: "[Motorola-branded SB6141 user guide](https://d15yx0mnc9teae.cloudfront.net/sites/default/files/Motorola_SB6141_manual.pdf) and [ARRIS SURFboard SB6141 manual](https://www.manualslib.com/manual/777279/Arris-Surfboard-Sb6141.html) — same modem sold under both brands"
  chipset: "Maintainer's teardown of one SB6141 unit, 2026-10-14. Green board
    marked 'SB6141 MAIN BOARD - 581887-002 REV4 - 30-JUL-2014'. Chip 1:
    Zentel A3R56E40ABF-8E, 526ZEN31, 56096784G-C (DDR2 SDRAM). Chip 2:
    RTL8211EG, F5E40P3, GF37B (Realtek gigabit PHY). Chip 3: iMC07, W530TH22,
    SLHCY, DNCE2530G (the SoC). Intel lists DNCE2530G as a cable DOCSIS
    product ([PCN 110800-01](https://intel.pcn.captnemo.in/pcn/805797/)).
    [BoxMatrix Puma5](https://boxmatrix.info/wiki/Puma5) says Intel renamed
    the TI TNETC4800 Puma 5 to DNCE2500 and lists DNCE2500GUS; it does not
    list DNCE2530G, so the Puma 5 family is inferred from the shared DNCE25xx
    series. The Broadcom BCM3380 this file used to state had no source and
    matches none of the three chips."
  end_of_life: "[Wayback captures of the manufacturer's SB6141 product page](https://web.archive.org/cdx/search/cdx?url=surfboard.com/products/cable-modems/sb6141*): live (HTTP 200) through 2021-12-09, redirected (302, 301) in captures dated 2022-12-23. The 2018-09-14, 2020-10-19 and 2021-10-26 captures show no end-of-life wording. The page was removed between 2021-12-09 and 2022-12-23; 2022 is the likelier year, not proven. No manufacturer notice found."
  release_date: "[Motorola SB6141 datasheet, © 2011, document dated 8/11](https://content.abt.com/documents/48624/SB6141-US-EN.pdf)"
  isps: "[Amazon listing, Comcast Xfinity, Cox, Charter, Time Warner, Mediacom, Bright House](https://www.amazon.com/dp/B00AJHDZSI); [Cox support article for the SB6141, ports and status lights, last updated 2025-07-03](https://www.cox.com/residential/support/arris--surfboard-sb6141.html)"

