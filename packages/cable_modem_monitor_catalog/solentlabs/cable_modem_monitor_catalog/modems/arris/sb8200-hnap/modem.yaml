manufacturer: ARRIS
model: SB8200
brands:
  - "SURFboard"
transport: hnap
default_host: "192.168.100.1"

auth:
  strategy: hnap
  hmac_algorithm: md5

hardware:
  docsis_version: "3.1"
  hw_version: v6
  chipset: "Broadcom BCM3390"
  firmware: TB01
  release_date: "2017"

status: confirmed

sources:
  auth_config: "[#165 — SB8200 HW v6 TB01 firmware](https://github.com/solentlabs/cable_modem_monitor/issues/165)"
  brands: "[SB8200 product page](https://www.surfboard.com/products/cable-modems/sb8200/) — SURFboard styling"
  chipset: "[DeviWiki](https://deviwiki.com/wiki/Arris_SB8200)"
  hardware: "[ARRIS SB8200 page](https://www.surfboard.com/products/cable-modems/sb8200/)"
  release_date: "[ARRIS press release, 2015-10-12](https://www.vistancenetworks.com/press-releases/2015/arris-unveils-next-generation-docsis-3.1-modems) announces the SB8200 for retail, 'available in 2016'. [404 Tech Support](https://www.404techsupport.com/2017/03/01/arris-surfboard-sb8200/amp/), dated 2017-03-01 by its URL (the page shows no date), reports it 'available for retail sale from their website and Amazon.com'. The announcement year differs; 2017 is the first retail evidence found."
  isps: "[Cox certified cable modems](https://www.cox.com/residential/support/certified-cable-modems.html) names the SB8200 (read 2026-10-20); [SURFboard SB8200 product page](https://www.surfboard.com/products/cable-modems/sb8200/): 'Compatible with Cox, Spectrum, Xfinity and other major US cable internet providers'."

attribution:
  contributors:
    - github: https://github.com/inventor7777
      contribution: "TB01 firmware HAR capture (Issue #165)"

isps:
  - Cox

notes: |
  TB01 firmware variant of the ARRIS SB8200 (Hardware Version 6, Cox provisioning).
  Uses HNAP protocol with GetCustomer* actions, identical to the Arris S33 HNAP stack.

  Path casing differs from AB01 variants: all HTML page paths start with a capital
  letter (/Login.html, /Cmconnectionstatus.html). The server returns 404 on lowercase
  paths — this is what causes AB01-style url_token auth to fail on this firmware.

  TLS cert CN: localhost.localdomain (AB01 variants use a MAC-address CN).
  Reboot capability: unknown — SB8200 series historically has reboot disabled by
  ISP firmware. Needs verification on this firmware family before enabling.

  The device serial in modem.har entries 34 (SerialNumber) and 43, 76
  (StatusSoftwareSerialNum) was redacted here afterwards to [REDACTED].
  The older automated pass left it; har-capture 0.13.1 flags it.

references:
  issues:
    - "[#165 — [Modem Request] Arris SB8200 v6](https://github.com/solentlabs/cable_modem_monitor/issues/165)"
    - "[#81 — SB8200 AB01 firmware variants (separate entry)](https://github.com/solentlabs/cable_modem_monitor/issues/81)"
