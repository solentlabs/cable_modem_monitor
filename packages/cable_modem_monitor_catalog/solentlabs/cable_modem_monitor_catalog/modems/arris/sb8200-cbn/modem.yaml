manufacturer: ARRIS
model: SB8200
brands:
  - "SURFboard"
transport: cbn
default_host: "192.168.100.1"

auth:
  strategy: form_cbn
  # CBN_Encrypt(EncryptString, HwModel) in encrypt_cryptoJS.js labels the
  # envelope "HS:" + HwModel + ":"; LoginFunc (js/Login.js) encrypts the
  # entered username too, with HwModel from getter fun=1 (common_api.js).
  cipher_prefix: "HS:{hw_model}:"
  hw_model_fun: 1

session:
  # The browser's jQuery POSTs carry these on every getter/setter call in
  # all three AC01 captures; the firmware's check, if any, is unobserved
  # (#231). Referer is the login page's, as on the login calls.
  headers:
    Origin: "{base_url}"
    Referer: "{base_url}/common_page/login.html"
    X-Requested-With: "XMLHttpRequest"

actions:
  restart:
    type: cbn
    fun: 8
  logout:
    type: cbn
    fun: 16

hardware:
  docsis_version: "3.1"
  hw_version: v3
  chipset: "Broadcom BCM3390"
  firmware: AC01
  release_date: "2023"

status: confirmed

sources:
  auth_config: "Firmware JS in test_data/modem.har ([#231](https://github.com/solentlabs/cable_modem_monitor/issues/231)): encrypt_cryptoJS.js CBN_Encrypt, js/Login.js LoginFunc, js/common_api.js loadGlobalValue. Same firmware and JS as the [#109](https://github.com/solentlabs/cable_modem_monitor/issues/109) capture."
  session_headers:
    "test_data/modem.har — Origin, Referer and X-Requested-With: XMLHttpRequest
    on the getter fun=1 [27] and login setter fun=15 [28] POSTs; the same three
    on every getter/setter POST in the #109 capture and the #231 failed-login
    capture"
  brands: "[SB8200 product page](https://www.surfboard.com/products/cable-modems/sb8200/) — SURFboard styling"
  chipset: "[DeviWiki](https://deviwiki.com/wiki/Arris_SB8200)"
  hardware: "[ARRIS SB8200 product page](https://www.surfboard.com/products/cable-modems/sb8200/)"
  isps: "[SURFboard SB8200 product page](https://www.surfboard.com/products/cable-modems/sb8200/): 'Compatible with Cox, Spectrum, Xfinity and other major US cable internet providers'; footer: 'tested and qualified by Cox, Comcast Xfinity, and Charter Spectrum' (read 2026-10-20). [Cox certified cable modems](https://www.cox.com/residential/support/certified-cable-modems.html) names the SB8200 (read 2026-10-20). [Spectrum authorized modems](https://www.spectrum.net/support/internet/compliant-modems-spectrum-network) names the SB8200 (read 2026-10-20)."
  release_date: "The AC01 firmware, not the SB8200 hardware (see arris/sb8200): the firmware string reported in [#109](https://github.com/solentlabs/cable_modem_monitor/issues/109), AC01.02.003_072823_8200.03.07.735.CT, carries the build stamp 072823, read as 2023-07-28."

attribution:
  contributors:
    - github: https://github.com/petep0p
      contribution: "HAR capture, firmware identification (AC01 variant)"
    - github: https://github.com/mplawner
      contribution: "Full-session HAR capture (login, status pages, logout) and failed-login capture"
    - github: https://github.com/kwschulz
      contribution: "Maintainer — v3.14 CBN transport, parser, catalog entry"

isps:
  - Comcast
  - Cox
  - Spectrum
  - Xfinity

notes: |
  AC01 firmware variant of the ARRIS SB8200. Shares CBN/Compal platform
  with CH7465MT but with DOCSIS 3.1 OFDM/OFDMA support.
  XML POST API: /xml/getter.xml and /xml/setter.xml, fun=N dispatch.
  Rotating sessionToken cookie on every response.
  AES-256-CBC encrypted login (CBN_Encrypt from encrypt_cryptoJS.js).

  test_data/modem.har is the #231 har-capture session. The contributor
  redacted the login field values and session tokens and stripped
  Set-Cookie headers before sharing. At intake the TLS certificate
  subjectName (a per-device identifier, 267 entries) was replaced with
  XXXXXXXXXXXX: har-capture's sanitizer does not reach _securityDetails.

references:
  issues:
    - "[#109 — [Modem Request] ARRIS SB8200v3 (AC01 firmware)](https://github.com/solentlabs/cable_modem_monitor/issues/109)"
    - "[#231 — SB8200v3 AC01: Form Login CBN disconnects during setup on v3.14.1](https://github.com/solentlabs/cable_modem_monitor/issues/231)"
    - "[#81 — SB8200 HTTPS variant (AB01 firmware, separate entry)](https://github.com/solentlabs/cable_modem_monitor/issues/81)"
