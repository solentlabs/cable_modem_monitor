downstream:
  format: xml
  tables:
    - resource: "10"
      root_element: downstream_table
      child_element: downstream
      columns:
        - source: chid
          field: channel_id
          type: integer
        - source: freq
          field: frequency
          type: frequency
        - source: pow
          field: power
          type: float
        - source: snr
          field: snr
          type: float
        - source: mod
          field: modulation
          type: modulation
      channel_type:
        fixed: "qam"
      lock_status:
        all_of:
          - IsLocked
      filter:
        channel_id:
          not: 0
    # SC-QAM codeword counters, keyed by dsid (= fun 10 chid). index.html
    # getdocsisSignal reads them into the table it renders for fun 10.
    - resource: "19"
      root_element: signal_table
      child_element: signal
      merge_by: [channel_id]
      columns:
        - source: dsid
          field: channel_id
          type: integer
        - source: correctable
          field: corrected
          type: integer
        - source: uncorrectable
          field: uncorrected
          type: integer
    - resource: "9"
      root_element: downstreamOFDM_table
      child_element: downstream
      columns:
        - source: dsid
          field: channel_id
          type: integer
        - source: plcFrequency
          field: frequency
          type: frequency
        - source: PLCPower
          field: power
          type: float
        - source: PlcScAvgMer
          field: snr
          type: float
        - source: ofdmCorrected
          field: corrected
          type: integer
        - source: ofdmUncorrectable
          field: uncorrected
          type: integer
      channel_type:
        fixed: "ofdm"
      lock_status:
        all_of:
          - ofdmIsLocked

upstream:
  format: xml
  tables:
    - resource: "11"
      root_element: upstream_table
      child_element: upstream
      columns:
        - source: usid
          field: channel_id
          type: integer
        - source: freq
          field: frequency
          type: frequency
        - source: power
          field: power
          type: float
        - source: bandwidth
          field: channel_width
          type: integer
      channel_type:
        fixed: "qam"
      lock_status:
        all_of:
          - usLocked
      filter:
        channel_id:
          not: 0
    - resource: "6"
      root_element: upstreamOFDMA_table
      child_element: upstream
      columns:
        - source: usid
          field: channel_id
          type: integer
        - source: centerFreq
          field: frequency
          type: frequency
        - source: repPower1_6
          field: power
          type: float
        # index.html getUpstreamTable: bandwidth = parseInt(width*1000).
        - source: width
          field: channel_width
          type: integer
          scale: 1000
      channel_type:
        fixed: "ofdma"
      lock_status:
        all_of:
          - ofdmaLocked
      # index.html skips usid 0.
      filter:
        channel_id:
          not: 0

system_info:
  sources:
    - format: xml
      resource: "1"
      root_element: GlobalSettings
      fields:
        - source: SwVersion
          field: software_version
          type: string
        # Cmswinfo.html: Hardware Version shows cm_hardware_version, System
        # Up Time shows cm_system_uptime; common_api.js shows cm_status as
        # the modem's status line.
        - source: cm_hardware_version
          field: hardware_version
          type: string
        - source: HwModel
          field: model_name
          type: string
        - source: cm_system_uptime
          field: system_uptime
          type: uptime
          format: "{days}day(s){hours}h:{minutes}m:{seconds}s"
        - source: cm_status
          field: docsis_status
          type: string
