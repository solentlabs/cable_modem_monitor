notes: |
  Two firmware variants with different auth requirements:
  - Older firmware: No authentication required
  - Newer firmware (9.1.103+): Form login with client-generated nonce

  Auth flow (form_nonce strategy):
  - POST to /cgi-bin/adv_pwd_cgi with username, password, ar_nonce fields
  - No encoding - plain form fields
  - Nonce: 8 random digits (client-generated)
  - Response: "Url:/path" (success) or "Error:msg" (failure)
  - Session: credential cookie

  Parser based on SB6141 code; fixture provenance unknown.
  URL format differs from SB6141: uses .html extension vs .asp
  Quirk — Intel Puma 6 chipset: individual channels can report tens of
  millions of corrected/uncorrectable codewords while neighbors show
  hundreds. Two channels dominate any aggregate, making totals
  misleading. Aggregate intentionally omitted; per-channel data is
  available. Well-documented chipset issue across the industry.
  Not mapped — hardware_version, software_version, system_uptime: they
  are on /cgi-bin/swinfo, which only the no-login capture requests. No
  login-firmware capture requests it; a mapping would 404 the poll if
  that firmware lacks the page. Needs a login-firmware capture that
  opens Product Information.

