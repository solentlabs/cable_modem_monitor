manufacturer: Arris
model: S34
brands:
  - "SURFboard"
transport: hnap
default_host: 192.168.100.1

auth:
  strategy: hnap
  hmac_algorithm: sha256

actions:
  restart:
    type: hnap
    action_name: SetArrisConfigurationInfo
    params:
      Action: reboot
      SetEEEEnable: ${ethSWEthEEE:0}
      LED_Status: ${LedStatus:1}
    pre_fetch_action: GetArrisConfigurationInfo
    response_key: SetArrisConfigurationInfoResponse
    result_key: SetArrisConfigurationInfoResult
    success_value: OK

hardware:
  docsis_version: "3.1"
  chipset: Broadcom BCM3390
  release_date: "2024"

status: awaiting_verification

sources:
  brands: "[SURFboard product family](https://www.surfboard.com/products/cable-modems/sb8200/) — manufacturer styles the brand SURFboard"
  auth_config: "[PR #90 S34 support](https://github.com/solentlabs/cable_modem_monitor/pull/90)"
  chipset: "[ModemGuides S33 review](https://www.modemguides.com/blogs/modemguides-blog/arris-s33-vs-sb8200-comparison) — same BCM3390 platform as S33"
  detection_hints: "[PR #90 S34 support](https://github.com/solentlabs/cable_modem_monitor/pull/90)"
  hardware: "[SURFboard S34 page](https://www.surfboard.com/products/cable-modems/s34/)"
  release_date: "[SURFboard S34 product page](https://www.surfboard.com/uk/products/cable-modems/s34) carries '© 2024 Vantiva USA, LLC'; the Wayback Machine's first capture of the [US page](https://web.archive.org/web/20240223234430/https://www.surfboard.com/products/cable-modems/s34/) is 2024-02-23. No launch announcement found; the year is the earliest dated evidence."
  isps: "[SURFboard S34 product page](https://www.surfboard.com/uk/products/cable-modems/s34): 'Compatible with Cox, Spectrum, Xfinity and other major US cable internet providers' (read 2026-10-20). [Cox certified cable modems](https://www.cox.com/residential/support/certified-cable-modems.html) names the S34 (read 2026-10-20). [Spectrum authorized modems](https://www.spectrum.net/support/internet/compliant-modems-spectrum-network) names the S34 (read 2026-10-20). Comcast is the Xfinity brand; the manufacturer page names Xfinity."

attribution:
  contributors:
    - github: https://github.com/rplancha
      contribution: "Initial implementation and HAR capture (PR #90)"

isps:
  - Comcast
  - Cox
  - Spectrum
  - Xfinity

notes: |
  HNAP protocol uses GetCustomer* action names (same as S33).
  Key difference from S33: Uses HMAC-SHA256 instead of HMAC-MD5.
  Firmware pattern: AT01.01.* (vs S33's TB01.03.*).
  S34 blocks ICMP ping - HTTP-only health checks required.
  System uptime not available (only current time exposed).
  Known firmware quirk: Sends malformed HTTP headers with debug timing data.
  Reboot params mirrored from S33 fix (#146); pre-fetch defaults
  are the safety net pending variant validation.

references:
  issues:
    - "[#108 — [Modem Request] ARRIS S34](https://github.com/solentlabs/cable_modem_monitor/issues/108)"
    - "[#146 — [Bug]: Arris S33 Modem Reboot Not Working](https://github.com/solentlabs/cable_modem_monitor/issues/146)"
  prs:
    - "[PR #90 — feat(parsers): Add Arris S34 cable modem support](https://github.com/solentlabs/cable_modem_monitor/pull/90)"
