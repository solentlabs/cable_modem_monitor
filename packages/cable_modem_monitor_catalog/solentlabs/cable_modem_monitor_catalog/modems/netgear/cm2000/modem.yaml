manufacturer: Netgear
model: CM2000
brands:
  - "Nighthawk"
transport: http
default_host: "192.168.100.1"

auth:
  strategy: form
  action: "/goform/Login"
  action_source: login_page
  login_page: "/"
  username_field: loginName
  password_field: loginPassword
  cookie_name: "XSRF_TOKEN"
  success:
    redirect: "/index.htm"

actions:
  restart:
    type: http
    method: POST
    endpoint: "/goform/RouterStatus"
    endpoint_pattern: "RouterStatus"
    params:
      buttonSelect: "2"
      wantype: dhcp
      enable_apmode: "0"

    pre_fetch_url: "/RouterStatus.htm"

hardware:
  docsis_version: "3.1"
  chipset: "Broadcom BCM3390"
  release_date: "2020-08"

status: awaiting_verification

sources:
  brands: "[Netgear product page](https://www.netgear.com/home/wifi/modems/cm2000/) — Nighthawk branding"
  auth_config:
    "[#226 Netgear CM2000 login fails on v3.14.x](https://github.com/solentlabs/cable_modem_monitor/issues/226)
    — reporter's capture (fw V8.01.02), committed as test_data/modem.har: the
    login form action /goform/Login?id=N differs on every page load, GET /
    sets XSRF_TOKEN, an accepted login is a 302 to /index.htm and a refused one
    a 302 to /Login.htm"
  restart_action:
    "test_data/modem.har entries 188-189, transplanted from the netgear/cm2500
    capture (#189): the POST and the Reboot.htm page. This unit's own
    RouterStatus.htm (entry 81) carries the same form: action
    /goform/RouterStatus?id=N, hidden buttonSelect, wantype=dhcp and
    enable_apmode=0"
  chipset: "[Homeowner.com Review](https://www.homeowner.com/connectivity/netgear/netgear-cm2000-review)"
  detection_hints: "[#38 Netgear CM2000](https://github.com/solentlabs/cable_modem_monitor/issues/38)"
  release_date: "[Dong Knows, 2020-09-22](https://dongknows.com/netgear-2-5-gbps-cable-modems-now-shipping): 'the CM2000 and CM2050V are both available now'. [SpeedGuide](https://www.speedguide.net/routers/netgear-cm2000-nighthawk-25gbps-cable-modem-4652) added its listing 2020-08-30. A NETGEAR community post says ISP release was about 2020-01-23; the August month is the earliest retail-side evidence, not a launch notice."
  isps: "[NETGEAR CM2000 product page, Wayback capture 2021-01-18](https://web.archive.org/web/20210118104342/https://www.netgear.com/home/wifi/modems/cm2000/): 'works right out of the box with major internet service providers, including XFINITY from Comcast, Spectrum, Cox, and more'. [Cox certified cable modems](https://www.cox.com/residential/support/certified-cable-modems.html) and [Spectrum authorized modems](https://www.spectrum.net/support/internet/compliant-modems-spectrum-network) name the CM2000 (read 2026-10-20). Xfinity is Comcast's brand."

attribution:
  contributors:
    - github: https://github.com/m4dh4tt3r-88
      contribution:
        "[Issue #38](https://github.com/solentlabs/cable_modem_monitor/issues/38)
        diagnostics, [issue #226](https://github.com/solentlabs/cable_modem_monitor/issues/226)
        capture"

isps:
  - Comcast
  - Cox
  - Spectrum
  - Xfinity

notes: |
  Nighthawk DOCSIS 3.1 modem with 2.5 Gbps max downstream speed.
  32 SC-QAM downstream channels plus OFDM (DOCSIS 3.1).
  Provides system uptime and time data (unlike CM600).
  Reboot via RouterStatus.htm with buttonSelect values and dynamic session ID.
  Provisioned speed is not parsed: DocsisStatus.htm's
  InitProvRateTableUpdateView() reads ds_prov_rate/us_prov_rate, but the
  InitProvRateTableTagValue() body loads by XHR and no capture on file
  holds it. A capture taken with the current guide (one Refresh click per
  status page) would supply it.
  Login: the form action's ?id= changes on every page load and a POST
  without it is refused (#226), so action_source reads it off the login
  page at every login. Accepted logins redirect to /index.htm, refused ones
  to /Login.htm.
  Fixture: test_data/modem.har is a composite. Entries 0-187 are the #226
  reporter's real session on this unit (original creator Playwright, serial
  replaced by hand); that session never sent a restart. Entries 188-189
  (POST /goform/RouterStatus and GET /Reboot.htm) come from the CM2500
  capture (#189) and were not observed on a CM2000. A capture of the restart
  on this model replaces them.
  Logout: not declared. The capture never exercised it. index.htm's
  gui_logout() opens Logout.htm, and the page's own script submits a form to
  /goform/logout?id=N (the v3.13.1 fixture), so a plain GET may not end the
  session. A capture that logs in, logs out and logs in again decides it.
  Hand redaction: the TLS certificate subject in modem.har carried the unit's
  MAC (har-capture's pseudonym for it) and now reads XX:XX:XX:XX:XX:XX;
  har-capture masks headers and cookies but not _securityDetails.

references:
  issues:
    - "[#38 — [Modem Request] Netgear CM2000](https://github.com/solentlabs/cable_modem_monitor/issues/38)"
    - "[#226 — [Bug]: Netgear CM2000 login fails on v3.14.x: catalog entry lost `?id=` form-action handling (regression from v3.13.1)](https://github.com/solentlabs/cable_modem_monitor/issues/226)"
