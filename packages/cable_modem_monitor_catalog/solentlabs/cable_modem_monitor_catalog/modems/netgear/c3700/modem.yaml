manufacturer: Netgear
model: C3700
transport: http
default_host: "192.168.100.1"

auth:
  strategy: basic
  challenge_cookie: true
  cookie_name: XSRF_TOKEN

actions:
  restart:
    type: http
    method: POST
    endpoint: /goform/RouterStatus
    endpoint_pattern: RouterStatus
    params:
      buttonSelect: "2"
      curlang: English
      enable_apmode: "0"
      wantype: dhcp
    pre_fetch_url: /RouterStatus.htm
    refused:
      redirect: /ErrorMsg.htm

hardware:
  docsis_version: "3.0"
  chipset: "Broadcom BCM3383"

  release_date: "2014"

status: confirmed

sources:
  auth_config:
    "test_data/modem.har, maintainer capture of a C3700 (2026-11-26, fw V2.02.18): a request
    without credentials is answered 401 with Set-Cookie XSRF_TOKEN, a request with Basic
    credentials and no cookie is answered 401, and the retry with credentials and that cookie
    is answered 200"

  restart_action:
    "test_data/modem.har entry 236, maintainer restart recording of the same C3700 (2026-11-27,
    fw V2.02.18): after a /RouterStatus.htm pre-fetch, the form's POST to
    /goform/RouterStatus?id=N with its four hidden fields was answered 302 to /Reboot.htm and
    the unit rebooted. Refusal (refused.redirect): maintainer live test (2026-11-26) and the
    2026-11-27 recording (raw records not committed): POST /goform/RouterStatus with no form id
    was answered 302 to /ErrorMsg.htm (security token expired) and the unit did not reboot"
  chipset: "[BCM3383 Datasheet](https://www.prnewswire.com/news-releases/broadcom-launches-gigabit-docsis-cable-gateway-family-186004842.html)"
  detection_hints: "Maintainer verified"
  release_date: "[NETGEAR C3700 product page, Wayback first capture 2014-03-19](https://web.archive.org/web/20140319021052/http://www.netgear.com/home/products/networking/cable-modems-routers/C3700.aspx) (page footer © 1996-2014). CableLabs lists a C3700_3000 certification in 2013 (wave 99, [CableLabs list](https://web.archive.org/web/20260216183300/https://www.cablelabs.com/wp-content/uploads/2013/10/Certified_Products.pdf)); 2014 is the year the retail page first appears."
  isps: "[NETGEAR C3700 product page, Wayback capture 2018-01-04](https://web.archive.org/web/20180104010004/http://www.netgear.com/home/products/networking/cable-modems-routers/C3700.aspx): 'Certified to work with U.S. cable Internet providers like XFINITY from Comcast, Spectrum, Cox, Cablevision & more'. The 2014-03-19 capture lists 'Cox, Time Warner Cable, XFINITY'. [Cox certified cable modems](https://www.cox.com/residential/support/certified-cable-modems.html) names the C3700 (read 2026-10-20); Spectrum's [authorized list](https://www.spectrum.net/support/internet/compliant-modems-spectrum-network) does not (read 2026-10-20), so Spectrum is kept for existing users."

attribution:
  contributors:
    - github: https://github.com/kwschulz
      contribution: "Maintainer verified"

isps:
  - Comcast
  - Cox
  - Spectrum

notes: |
  Combo modem/router device with 8x4 channel bonding (DOCSIS 3.0), per the
  NETGEAR C3700 product page (Wayback capture 2014-03-19, cited under
  sources.release_date): "Modem 8x4 CableLabs certified DOCSIS 3.0".
  Multi-page parsing: DocsisStatus.htm for channel data, RouterStatus.htm
  for system info. Channel data in pipe-delimited JavaScript:
  InitDsTableTagValue() and InitUsTableTagValue().
  Page extensions are .htm (not .asp like the CM600).
  test_data/modem.har is a maintainer-declared hybrid of two captures of
  one unit: the 2026-11-26 page walk, plus the restart POST (entry 236)
  from the 2026-11-27 restart recording. Its log.comment gives the
  continuity evidence. Replace it with a single full-session capture
  that includes a restart if one arrives.

references:
  issues: []
