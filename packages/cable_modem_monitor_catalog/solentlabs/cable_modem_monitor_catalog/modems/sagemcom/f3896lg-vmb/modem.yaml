  contributors:
    - github: https://github.com/Dinth
      contribution: "Initial Hub 5 support and REST API documentation"
    - github: https://github.com/edent
      contribution: "Bearer login and reboot flow, confirmed via curl"
    - github: https://github.com/dcninja
      contribution: "Hardware confirmation of monitoring and dashboard"

isps:
  - Virgin Media UK

notes: |
  DOCSIS 3.1 gateway made by Sagemcom. Chipset: Broadcom BCM3390.
  Sold by Virgin Media as the "Hub 5" (community name "SuperHub 5").
  REST API at /rest/v1/cablemodem/ - no authentication required.
  32 SC-QAM downstream + 1 OFDM, 5 ATDMA upstream + 1 OFDMA.
  bootFilename shows "vmdg660" (Virgin's internal designation).
  Default IP: 192.168.100.1 (modem mode) or 192.168.0.1 (router mode).

  Restart is unconfirmed on hardware. Two contributors pressed the
  button and the modem did not reboot (#82); the fix that followed
  has not been retested.

  modem.har is a SYNTHESIZED fixture (MODEM_INTAKE_WORKFLOW
  § Assembled fixtures) — data, login, and reboot entries built from
  the issue #82 response shapes, reboot flow confirmed via curl.
  Full declaration in the HAR's log.comment. Replace with a real
  full-session capture when a contributor provides one.

  The synthesized login body carries a password and no username key,
  the shape @edent's curl proved. It once carried a username because
  it was written to match what Core sent, not what the firmware
  accepts, and that made the fixture certify the client's own bug.

references:
  issues:
    - "[#82 — [Modem Request] Virgin Media SuperHub - modem mode 5](https://github.com/solentlabs/cable_modem_monitor/issues/82)"
